<html lang="en">
<head>
  <meta charset="utf-8">

<body>
  <a class="skip" href="#card">Skip to the question</a>

  <div class="app" id="app" data-screen="start">
    <div class="col">
      <main class="deck" id="deck">
        <div class="under under-2" aria-hidden="true"></div>
        <div class="under under-1" aria-hidden="true"></div>
        <section class="card start" id="card" tabindex="-1" aria-live="polite"></section>
      </main>

      <div class="dock" id="dock">
        <button class="act rewind" id="back" type="button" disabled>
          <span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg></span>
          <span class="word">Back</span>
        </button>
        <button class="act no" id="act-no" type="button">
          <span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
          <span class="word">No</span>
        </button>
        <button class="act yes" id="act-yes" type="button">
          <span class="disc"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z"/></svg></span>
          <span class="word">Yes</span>
        </button>
      </div>
    </div>
  </div>

  <noscript>
    <div class="noscript">

    </div>
  </noscript>
